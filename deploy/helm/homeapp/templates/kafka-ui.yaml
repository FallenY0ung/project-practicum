apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-ui
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}-kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kafka-ui
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: kafbat/kafka-ui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: {{ .Release.Name }}-kafka:9092
